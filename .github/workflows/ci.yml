name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify the runtime pins
        run: |
          test "$(node -p 'process.versions.node.split(".")[0]')" = 24
          test "$(pnpm --version)" = 11.19.0

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript and run tests
        run: pnpm check

      - name: Build the web package
        run: pnpm build

  rust:
    name: rust (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # macos-latest is the standard arm64 GitHub-hosted image. An Intel
          # macOS asset is intentionally not claimed without an available
          # private-repository runner label.
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master (resolved 2026-09-09)
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Verify the native Rust target
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$EXPECTED_TARGET"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --target "${{ matrix.target }}" --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --target "${{ matrix.target }}" --workspace --all-targets --locked

      - name: Build native binaries
        run: cargo build --target "${{ matrix.target }}" --workspace --locked

      - name: Smoke the native binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./target/${{ matrix.target }}/debug/pskills --version
          ./target/${{ matrix.target }}/debug/pskills --help

      - name: Smoke the native binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\target\${{ matrix.target }}\debug\pskills.exe --version
          .\target\${{ matrix.target }}\debug\pskills.exe --help

  container:
    name: build the Node container
    needs:
      - web
      - rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Build the pinned API runtime image
        run: docker build --target runtime --tag private-skills:ci .

      - name: Build the pinned worker image
        run: docker build --target worker --tag private-skills-worker:ci .
