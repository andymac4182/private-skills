name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg18@sha256:508c5290cda481d4f5f846446a26e9c1b804766828a394a5861de1b348a18b4c
        env:
          POSTGRES_PASSWORD: pskills_ci_ephemeral
          POSTGRES_DB: pskills_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pskills_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:pskills_ci_ephemeral@127.0.0.1:5432/pskills_test
      PSKILLS_TEST_PGVECTOR_URL: postgres://postgres:pskills_ci_ephemeral@127.0.0.1:5432/pskills_test
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify the runtime pins
        run: |
          test "$(node -p 'process.versions.node.split(".")[0]')" = 24
          test "$(pnpm --version)" = 11.19.0

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript and run tests
        run: pnpm check

      - name: Build the web package
        run: pnpm build

      - name: Build the Eve reviewer
        working-directory: apps/reviewer
        env:
          EVE_TELEMETRY_DISABLED: '1'
        run: node ../../node_modules/eve/bin/eve.js build --skip-sandbox-prewarm

      - name: Verify portable Vercel and Cloudflare builds
        run: |
          PSKILLS_STORAGE_BUILD_PROFILE=vercel-blob node scripts/build-vercel.mjs
          PSKILLS_RUNTIME_PROFILE=edge NITRO_PRESET=cloudflare_module node node_modules/vite/bin/vite.js build --config apps/web/vite.config.ts

  rust:
    name: rust (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # macos-latest is the standard arm64 GitHub-hosted image. An Intel
          # macOS asset is intentionally not claimed without an available
          # private-repository runner label.
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master (resolved 2026-09-09)
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Verify the native Rust target
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$EXPECTED_TARGET"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --target "${{ matrix.target }}" --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --target "${{ matrix.target }}" --workspace --all-targets --locked

      - name: Build native binaries
        run: cargo build --target "${{ matrix.target }}" --workspace --locked

      - name: Smoke the native binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./target/${{ matrix.target }}/debug/pskills --version
          ./target/${{ matrix.target }}/debug/pskills --help

      - name: Smoke the native binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\target\${{ matrix.target }}\debug\pskills.exe --version
          .\target\${{ matrix.target }}\debug\pskills.exe --help

  container:
    name: build the Node container
    needs:
      - web
      - rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the pinned API runtime image
        run: docker build --target runtime --tag private-skills:ci .

      - name: Build the pinned worker image
        run: docker build --target worker --tag private-skills-worker:ci .
