name: Scanner acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/scanner-acceptance.yml'
      - 'packages/scanners/**'
      - 'workers/images/**'
      - 'scripts/scanner-acceptance.*'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/scanner-acceptance.yml'
      - 'packages/scanners/**'
      - 'workers/images/**'
      - 'scripts/scanner-acceptance.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scanner-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scanner-acceptance:
    name: build and run pinned scanners
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Docker daemon
        run: docker version

      - name: Build images and run real engine roundtrip
        run: ./scripts/scanner-acceptance.sh all
